<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Terminal 1</title>
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <script type="module" src="/src/components/t1-icon/index.ts"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--t1-font-sans);
        background: var(--t1-color-neutral-50);
        color: var(--t1-color-neutral-900);
        min-height: 100vh;
      }

      .sticky-nav {
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header {
        background: var(--t1-color-neutral-0);
        border-bottom: 1px solid var(--t1-color-neutral-200);
        padding: var(--t1-spacing-large) var(--t1-spacing-3x-large);
        display: flex;
        align-items: center;
      }

      .header-link {
        display: flex;
        align-items: center;
        gap: var(--t1-spacing-large);
        text-decoration: none;
        color: inherit;
      }

      .header-logo {
        flex-shrink: 0;
        width: 100px;
        padding-top: 7px;
        object-fit: contain;
      }

      .header-text h1 {
        font-size: var(--t1-font-size-2x-large);
        font-weight: var(--t1-font-weight-bold);
        color: var(--t1-color-danger-600);
        letter-spacing: var(--t1-letter-spacing-dense);
      }

      .header-text p {
        margin-top: var(--t1-spacing-2x-small);
        font-size: var(--t1-font-size-medium);
        color: var(--t1-color-neutral-500);
      }

      .main {
        max-width: 960px;
        margin: 0 auto;
        padding: var(--t1-spacing-3x-large) var(--t1-spacing-large);
        display: flex;
        flex-direction: column;
        gap: var(--t1-spacing-3x-large);
      }

      .section-label {
        font-size: var(--t1-font-size-x-small);
        font-weight: var(--t1-font-weight-semibold);
        text-transform: uppercase;
        letter-spacing: var(--t1-letter-spacing-looser);
        color: var(--t1-color-neutral-400);
        margin-bottom: var(--t1-spacing-medium);
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: var(--t1-spacing-medium);
      }

      .section-card {
        display: flex;
        flex-direction: column;
        background: var(--t1-color-neutral-0);
        border: 1px solid var(--t1-color-neutral-200);
        border-radius: var(--t1-border-radius-large);
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        transition:
          box-shadow var(--t1-transition-fast),
          border-color var(--t1-transition-fast);
      }

      .section-card:hover {
        border-color: var(--t1-color-danger-400);
        box-shadow: var(--t1-shadow-medium);
      }

      .section-card-preview {
        background: var(--t1-color-neutral-50);
        border-bottom: 1px solid var(--t1-color-neutral-100);
        padding: var(--t1-spacing-3x-large);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--t1-spacing-medium);
        min-height: 160px;
      }

      .section-card-body {
        padding: var(--t1-spacing-large);
      }

      .section-card-body h2 {
        font-size: var(--t1-font-size-x-large);
        font-weight: var(--t1-font-weight-bold);
        color: var(--t1-color-neutral-900);
        margin-bottom: var(--t1-spacing-x-small);
      }

      .section-card-body p {
        font-size: var(--t1-font-size-small);
        color: var(--t1-color-neutral-500);
        line-height: var(--t1-line-height-dense);
      }

      .count-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.3em;
        font-size: var(--t1-font-size-x-small);
        font-weight: var(--t1-font-weight-semibold);
        padding: 0.2em 0.7em;
        border-radius: var(--t1-border-radius-pill);
        background: var(--t1-color-danger-100);
        color: var(--t1-color-danger-700);
        margin-top: var(--t1-spacing-small);
      }

      .count-pill-widgets {
        background: var(--t1-color-warning-100);
        color: var(--t1-color-warning-700);
      }

      .header-sdk-link {
        margin-left: auto;
        font-size: var(--t1-font-size-x-small);
        font-weight: var(--t1-font-weight-bold);
        letter-spacing: var(--t1-letter-spacing-looser);
        text-transform: uppercase;
        color: var(--t1-color-danger-600);
        text-decoration: none;
        padding: 0.3em 0.8em;
        border: 1px solid var(--t1-color-danger-300);
        border-radius: var(--t1-border-radius-medium);
        transition:
          background var(--t1-transition-fast),
          border-color var(--t1-transition-fast);
      }

      .header-sdk-link:hover {
        background: var(--t1-color-danger-50);
        border-color: var(--t1-color-danger-400);
      }

      @media (max-width: 640px) {
        .header {
          padding: var(--t1-spacing-small) var(--t1-spacing-large);
        }

        .header-logo {
          width: 64px;
        }

        .header-text h1 {
          font-size: var(--t1-font-size-x-large);
        }

        .header-text p {
          display: none;
        }

        .main {
          padding: var(--t1-spacing-2x-large) var(--t1-spacing-medium);
        }
      }
    </style>
  </head>
  <body>
    <div class="sticky-nav">
      <header class="header">
        <a href="/playground/" class="header-link">
          <img
            class="header-logo"
            src="https://terminal1.win/images/terminal-one.png"
            alt="Terminal 1"
          />
          <div class="header-text">
            <h1>Terminal 1</h1>
            <p>Web components built with TS, Lit & Vite</p>
          </div>
        </a>
        <a href="/playground/sdk-loader/" class="header-sdk-link">SDK Loader</a>
      </header>
    </div>

    <main class="main">
      <div>
        <p class="section-label">Explore</p>
        <div class="card-grid">
          <a href="/playground/components/" class="section-card">
            <div class="section-card-preview">
              <t1-icon
                name="layers-half"
                style="font-size: 3rem; color: var(--t1-color-danger-500)"
              ></t1-icon>
              <t1-icon
                name="layers"
                style="font-size: 3rem; color: var(--t1-color-danger-300)"
              ></t1-icon>
            </div>
            <div class="section-card-body">
              <h2>Components</h2>
              <p>Primitive UI building blocks — buttons, inputs, badges, tooltips, and more.</p>
              <span class="count-pill">22 components</span>
            </div>
          </a>

          <a href="/playground/widgets/" class="section-card">
            <div class="section-card-preview">
              <t1-icon
                name="gear-wide-connected"
                style="font-size: 3rem; color: var(--t1-color-danger-500)"
              ></t1-icon>
              <t1-icon
                name="gear-wide"
                style="font-size: 3rem; color: var(--t1-color-danger-300)"
              ></t1-icon>
            </div>
            <div class="section-card-body">
              <h2>Widgets</h2>
              <p>
                Higher-level feature components composed from primitives, with signal-driven state.
              </p>
              <span class="count-pill count-pill-widgets">1 widget</span>
            </div>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
