<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widgets — Terminal 1</title>
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <script type="module" src="/src/widgets/search-property-widget/index.ts"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--t1-font-sans);
        background: var(--t1-color-neutral-50);
        color: var(--t1-color-neutral-900);
        min-height: 100vh;
      }

      .sticky-nav {
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header {
        background: var(--t1-color-neutral-0);
        border-bottom: 1px solid var(--t1-color-neutral-200);
        padding: var(--t1-spacing-large) var(--t1-spacing-3x-large);
        display: flex;
        align-items: center;
      }

      .header-link {
        display: flex;
        align-items: center;
        gap: var(--t1-spacing-large);
        text-decoration: none;
        color: inherit;
      }

      .header-logo {
        flex-shrink: 0;
        width: 100px;
        padding-top: 7px;
        object-fit: contain;
      }

      .header-text h1 {
        font-size: var(--t1-font-size-2x-large);
        font-weight: var(--t1-font-weight-bold);
        color: var(--t1-color-danger-600);
        letter-spacing: var(--t1-letter-spacing-dense);
      }

      .header-text p {
        margin-top: var(--t1-spacing-2x-small);
        font-size: var(--t1-font-size-medium);
        color: var(--t1-color-neutral-500);
      }

      .breadcrumb {
        background: var(--t1-color-neutral-0);
        border-bottom: 1px solid var(--t1-color-neutral-100);
        padding: var(--t1-spacing-x-small) var(--t1-spacing-3x-large);
        display: flex;
        align-items: center;
        gap: var(--t1-spacing-small);
        font-size: var(--t1-font-size-small);
      }

      .breadcrumb a {
        color: var(--t1-color-danger-600);
        text-decoration: none;
      }

      .breadcrumb a:hover {
        text-decoration: underline;
      }

      .breadcrumb-sep {
        color: var(--t1-color-neutral-300);
      }

      .breadcrumb-current {
        color: var(--t1-color-neutral-500);
      }

      .main {
        max-width: 800px;
        margin: 0 auto;
        padding: var(--t1-spacing-3x-large) var(--t1-spacing-large);
        display: flex;
        flex-direction: column;
        gap: var(--t1-spacing-3x-large);
      }

      .section {
        display: flex;
        flex-direction: column;
        gap: var(--t1-spacing-medium);
      }

      .section-heading {
        font-size: var(--t1-font-size-large);
        font-weight: var(--t1-font-weight-semibold);
        color: var(--t1-color-neutral-900);
        padding-bottom: var(--t1-spacing-x-small);
        border-bottom: 1px solid var(--t1-color-neutral-200);
      }

      .section-desc {
        font-size: var(--t1-font-size-small);
        color: var(--t1-color-neutral-500);
        line-height: var(--t1-line-height-dense);
      }

      .demo-box {
        background: var(--t1-color-neutral-0);
        border: 1px solid var(--t1-color-neutral-200);
        border-radius: var(--t1-border-radius-large);
        padding: var(--t1-spacing-large);
        display: flex;
        flex-direction: column;
        gap: var(--t1-spacing-medium);
      }

      code {
        font-family: var(--t1-font-mono);
        font-size: var(--t1-font-size-x-small);
        background: var(--t1-color-neutral-100);
        padding: 0.1em 0.4em;
        border-radius: var(--t1-border-radius-small);
        color: var(--t1-color-neutral-700);
      }

      @media (max-width: 640px) {
        .header {
          padding: var(--t1-spacing-small) var(--t1-spacing-large);
        }

        .header-logo {
          width: 64px;
        }

        .header-text h1 {
          font-size: var(--t1-font-size-x-large);
        }

        .header-text p {
          display: none;
        }

        .breadcrumb {
          padding: var(--t1-spacing-x-small) var(--t1-spacing-large);
        }

        .main {
          padding: var(--t1-spacing-2x-large) var(--t1-spacing-medium);
        }
      }
    </style>
  </head>
  <body>
    <div class="sticky-nav">
      <header class="header">
        <a href="/playground/" class="header-link">
          <img
            class="header-logo"
            src="https://terminal1.win/images/terminal-one.png"
            alt="Terminal 1"
          />
          <div class="header-text">
            <h1>Terminal 1</h1>
            <p>Web components built with TS, Lit & Vite</p>
          </div>
        </a>
      </header>
      <nav class="breadcrumb">
        <a href="/playground/">Home</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current">Widgets</span>
      </nav>
    </div>

    <main class="main">
      <section class="section">
        <h2 class="section-heading">Search Property</h2>
        <p class="section-desc">
          Search available properties by name, address, or property type, and view detailed property
          information.
        </p>
        <div class="demo-box">
          <search-property-widget></search-property-widget>
        </div>
      </section>
    </main>
  </body>
</html>
