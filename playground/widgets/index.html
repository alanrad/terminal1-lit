<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Widgets — Terminal 1</title>
		<link rel="stylesheet" href="/src/styles/theme.css" />
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: var(--t1-font-sans);
				background: var(--t1-color-neutral-50);
				color: var(--t1-color-neutral-900);
				min-height: 100vh;
			}

			.header {
				position: sticky;
				top: 0;
				z-index: 100;
				background: var(--t1-color-neutral-0);
				border-bottom: 1px solid var(--t1-color-neutral-200);
				padding: var(--t1-spacing-large) var(--t1-spacing-3x-large);
				display: flex;
				align-items: center;
				gap: var(--t1-spacing-large);
			}

			.header-logo {
				flex-shrink: 0;
				width: 64px;
				height: 64px;
				padding-top: 7px;
				object-fit: contain;
			}

			.header-text h1 {
				font-size: var(--t1-font-size-2x-large);
				font-weight: var(--t1-font-weight-bold);
				color: var(--t1-color-primary-700);
				letter-spacing: var(--t1-letter-spacing-dense);
			}

			.header-text p {
				margin-top: var(--t1-spacing-2x-small);
				font-size: var(--t1-font-size-medium);
				color: var(--t1-color-neutral-500);
			}

			.header-nav {
				margin-left: auto;
				font-size: var(--t1-font-size-small);
				color: var(--t1-color-primary-600);
			}

			.header-nav a { color: inherit; text-decoration: none; }
			.header-nav a:hover { text-decoration: underline; }

			.main {
				max-width: 960px;
				margin: 0 auto;
				padding: var(--t1-spacing-3x-large) var(--t1-spacing-large);
			}

			.section-title {
				font-size: var(--t1-font-size-x-small);
				font-weight: var(--t1-font-weight-semibold);
				text-transform: uppercase;
				letter-spacing: var(--t1-letter-spacing-looser);
				color: var(--t1-color-neutral-400);
				margin-bottom: var(--t1-spacing-medium);
			}

			.card-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
				gap: var(--t1-spacing-medium);
			}

			.card {
				display: flex;
				flex-direction: column;
				background: var(--t1-color-neutral-0);
				border: 1px solid var(--t1-color-neutral-200);
				border-radius: var(--t1-border-radius-large);
				overflow: hidden;
				text-decoration: none;
				color: inherit;
				transition:
					box-shadow var(--t1-transition-fast),
					border-color var(--t1-transition-fast);
			}

			.card:hover {
				border-color: var(--t1-color-primary-400);
				box-shadow: var(--t1-shadow-medium);
			}

			.card-preview {
				background: var(--t1-color-neutral-50);
				border-bottom: 1px solid var(--t1-color-neutral-100);
				padding: var(--t1-spacing-2x-large);
				display: flex;
				align-items: center;
				justify-content: center;
				gap: var(--t1-spacing-small);
				min-height: 120px;
				font-size: var(--t1-font-size-x-large);
			}

			.card-body {
				padding: var(--t1-spacing-medium);
			}

			.card-body h2 {
				font-size: var(--t1-font-size-large);
				font-weight: var(--t1-font-weight-semibold);
				color: var(--t1-color-neutral-900);
				margin-bottom: var(--t1-spacing-3x-small);
			}

			.card-body p {
				font-size: var(--t1-font-size-small);
				color: var(--t1-color-neutral-500);
				line-height: var(--t1-line-height-dense);
			}

			.badge {
				display: inline-block;
				font-size: var(--t1-font-size-x-small);
				font-weight: var(--t1-font-weight-semibold);
				padding: 0.125rem 0.5rem;
				border-radius: var(--t1-border-radius-pill);
				background: var(--t1-color-warning-100);
				color: var(--t1-color-warning-700);
				margin-bottom: var(--t1-spacing-x-small);
			}
		</style>
	</head>
	<body>
		<header class="header">
			<img
				class="header-logo"
				src="https://terminal1.win/images/terminal-1.png"
				alt="Terminal 1"
			/>
			<div class="header-text">
				<h1>Terminal 1</h1>
				<p>Widgets built with Lit, TS & Vite</p>
			</div>
			<nav class="header-nav">
				<a href="/playground/">← All</a>
			</nav>
		</header>

		<main class="main">
			<p class="section-title">Widgets</p>
			<div class="card-grid">

				<a href="/playground/widgets/search-property-widget/" class="card">
					<div class="card-preview">
						<div style="display: flex; align-items: center; gap: 0.5rem; background: white; border: 1px solid var(--t1-color-neutral-300); border-radius: var(--t1-border-radius-medium); padding: 0.45em 0.75em; min-width: 200px;">
							<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="var(--t1-color-neutral-400)" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
							<span style="font-size: var(--t1-font-size-small); color: var(--t1-color-neutral-400);">Where would you like to go?</span>
						</div>
					</div>
					<div class="card-body">
						<span class="badge">search-property-widget</span>
						<h2>Search Property</h2>
						<p>
							Debounced property search input. Fires a configurable search callback after 300ms when the query exceeds 3 characters.
						</p>
					</div>
				</a>

			</div>
		</main>
	</body>
</html>
