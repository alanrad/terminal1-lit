<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>search-property-widget — T1 Widgets</title>
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <script type="module" src="/src/widgets/search-property-widget/index.ts"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--t1-font-sans);
        background: var(--t1-color-neutral-50);
        color: var(--t1-color-neutral-900);
        min-height: 100vh;
      }
      .topbar {
        background: var(--t1-color-neutral-0);
        border-bottom: 1px solid var(--t1-color-neutral-200);
        padding: var(--t1-spacing-medium) var(--t1-spacing-3x-large);
        display: flex;
        align-items: center;
        gap: var(--t1-spacing-medium);
      }
      .topbar a {
        font-size: var(--t1-font-size-small);
        color: var(--t1-color-primary-600);
        text-decoration: none;
      }
      .topbar a:hover {
        text-decoration: underline;
      }
      .topbar-sep {
        color: var(--t1-color-neutral-300);
      }
      .topbar h1 {
        font-size: var(--t1-font-size-large);
        font-weight: var(--t1-font-weight-semibold);
      }
      .content {
        max-width: 800px;
        margin: 0 auto;
        padding: var(--t1-spacing-3x-large) var(--t1-spacing-large);
        display: flex;
        flex-direction: column;
        gap: var(--t1-spacing-3x-large);
      }
      .section {
        display: flex;
        flex-direction: column;
        gap: var(--t1-spacing-medium);
      }
      .section-title {
        font-size: var(--t1-font-size-large);
        font-weight: var(--t1-font-weight-semibold);
        color: var(--t1-color-neutral-900);
        padding-bottom: var(--t1-spacing-x-small);
        border-bottom: 1px solid var(--t1-color-neutral-200);
      }
      .section-desc {
        font-size: var(--t1-font-size-small);
        color: var(--t1-color-neutral-500);
        line-height: var(--t1-line-height-dense);
      }
      .demo-box {
        background: var(--t1-color-neutral-0);
        border: 1px solid var(--t1-color-neutral-200);
        border-radius: var(--t1-border-radius-large);
        padding: var(--t1-spacing-large);
        display: flex;
        flex-direction: column;
        gap: var(--t1-spacing-medium);
      }
      code {
        font-family: var(--t1-font-mono);
        font-size: var(--t1-font-size-x-small);
        background: var(--t1-color-neutral-100);
        padding: 0.1em 0.4em;
        border-radius: var(--t1-border-radius-small);
        color: var(--t1-color-neutral-700);
      }
    </style>
  </head>
  <body>
    <nav class="topbar">
      <a href="/playground/widgets/">Widgets</a>
      <span class="topbar-sep">/</span>
      <h1>search-property</h1>
    </nav>

    <main class="content">
      <section class="section">
        <h2 class="section-title">Search Property</h2>
        <p class="section-desc">
          Type more than 3 characters to trigger a search. The call is debounced by 300ms — only the
          last value after you stop typing is sent. Open the browser console to see the search log.
        </p>
        <div class="demo-box">
          <search-property-widget></search-property-widget>
        </div>
      </section>
    </main>
  </body>
</html>
