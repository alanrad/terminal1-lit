<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Widget System — Dev Sandbox</title>
		<link rel="stylesheet" href="../src/styles/theme.css" />
		<style>
			body {
				font-family: system-ui, sans-serif;
				background: #f1f3f4;
				padding: 2rem;
				display: flex;
				flex-direction: column;
				gap: 2rem;
				align-items: flex-start;
			}

			h1 {
				margin: 0 0 0.5rem;
			}

			section {
				background: #fff;
				border-radius: 12px;
				padding: 1.5rem;
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
				min-width: 300px;
			}

			h2 {
				margin: 0 0 1rem;
				font-size: 1rem;
				color: #5f6368;
				text-transform: uppercase;
				letter-spacing: 0.05em;
			}

			pre {
				background: #f8f9fa;
				border-radius: 4px;
				padding: 0.5rem;
				font-size: 0.75rem;
				margin-top: 0.5rem;
			}

			/* Host-page override demo: change primary color for the counter */
			#themed-counter counter-widget {
				--t1-color-primary-600: #7c3aed;
				--t1-color-primary-700: #5b21b6;
				--t1-color-danger-600: #dc2626;
			}
		</style>
		<!-- Dev: import widgets directly via Vite -->
		<script type="module" src="../src/widgets/counter-widget/index.ts"></script>
		<script type="module" src="../src/widgets/posts-widget/index.ts"></script>
	</head>
	<body>
		<h1>Widget System — Dev Sandbox</h1>

		<section>
			<h2>Counter Widget (default theme)</h2>
			<counter-widget initial-count="0"></counter-widget>
			<pre id="counter-log">events will appear here…</pre>
		</section>

		<section id="themed-counter">
			<h2>Counter Widget (purple theme via CSS custom properties)</h2>
			<counter-widget initial-count="10"></counter-widget>
		</section>

		<section>
			<h2>Posts Widget (async data)</h2>
			<posts-widget limit="3"></posts-widget>
		</section>

		<script>
			document
				.querySelector("counter-widget")
				.addEventListener("w-change", (e) => {
					document.querySelector("#counter-log").textContent = JSON.stringify(
						e.detail,
						null,
						2,
					);
				});
		</script>
	</body>
</html>
